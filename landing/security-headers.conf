# Security headers for the WorkspAIce landing site.
#
# IMPORTANT: nginx `add_header` directives are inherited from the server
# level ONLY into locations that define no add_header of their own. Every
# content location below sets Cache-Control, so each one must `include`
# this snippet explicitly or it would silently lose all security headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "interest-cohort=()" always;

# The site is fully self-contained: same-origin scripts/styles/images only
# (theme-init.js is external precisely so no 'unsafe-inline' is needed).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
