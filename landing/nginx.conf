server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression for text assets (text/html is always gzipped when gzip is
  # on — listing it in gzip_types triggers a "duplicate MIME type" warning)
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types
    text/css
    application/javascript
    application/json
    application/ld+json
    image/svg+xml;

  # Security headers live in a snippet because add_header is NOT inherited
  # into locations that declare their own add_header (all of ours do).
  include /etc/nginx/snippets/security-headers.conf;

  error_page 404 /404.html;

  # Assets: cache for a week. NOT 1y/immutable — filenames aren't
  # content-hashed (no build pipeline), so a long TTL would pin stale
  # icons on returning visitors.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Don't cache HTML so updates are seen immediately
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Short cache for root CSS/JS (no build pipeline to hash them; trade
  # 5-min cache for faster propagation of style changes).
  location ~* ^/(style\.css|app\.js|theme-init\.js)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Everything else: exact match or a real 404 (no SPA fallback — this is
  # a one-page site; unknown URLs must not soft-200 to index.html).
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Don't serve dotfiles
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
}
