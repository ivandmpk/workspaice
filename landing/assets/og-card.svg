<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Social share card (1200x630). Render: rsvg-convert -w 1200 og-card.svg -o og-card.png -->
  <defs>
    <radialGradient id="glow-teal" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#76ABAE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#76ABAE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FF5722" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76ABAE"/>
      <stop offset="1" stop-color="#FF5722"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#303841"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>
  <rect width="1200" height="630" fill="url(#glow-orange)"/>

  <!-- App mark -->
  <g transform="translate(105 187) scale(1)">
    <rect x="0" y="0" width="224" height="224" rx="50" fill="#F5F5F5"/>
    <g transform="translate(-16 -16)">
      <path d="M44 84 L78 196 L108 128 L121 160 L134 128 L164 196 L188 92" stroke="#303841" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M202 60 L172 176" stroke="#76ABAE" stroke-width="24" stroke-linecap="round" fill="none"/>
      <rect x="170" y="170" width="62" height="62" rx="14" fill="#FF5722"/>
      <path d="M186 216 L196 186 L206 216 M190.5 207 L201.5 207" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M215 186 L215 216" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Copy -->
  <text x="400" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#F5F5F5">WorkspAIce</text>
  <text x="402" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#8FC6C9">Your AI, your machine, your rules.</text>
  <text x="402" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#B0B5BD">Local-first desktop AI workspace — no accounts,</text>
  <text x="402" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#B0B5BD">no telemetry, no subscriptions.</text>
  <text x="402" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#76ABAE">macOS  ·  Windows  ·  Free &amp; open source (GPLv3)</text>

  <rect x="0" y="618" width="1200" height="12" fill="url(#bar)"/>
</svg>
